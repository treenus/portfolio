# Netlify build configuration.
#
# The repo root is NOT a Next.js app — the app lives in `portfolio/`. Without an
# explicit `base`, Netlify runs `npm run build` at the root, finds no package.json,
# and the deploy fails.
[build]
  base = "portfolio"
  command = "npm run build"
  publish = ".next"

[build.environment]
  # Next 16 requires Node 20.8+.
  NODE_VERSION = "20"

# The Next.js Runtime is REQUIRED, not optional.
#
# Symptom without it: the build succeeds and the deploy "works", but every route
# returns Netlify's generic 404 (not app/not-found.tsx). That is because
# `publish = ".next"` then ships the raw build output, which contains no
# index.html at its root — only server/, static/, etc. Netlify's static server
# has nothing to serve, so requests never reach Next.
#
# This plugin is what turns the build output into a serverless function and
# rewrites routes to it. Netlify auto-installs it when it detects Next, but that
# detection is unreliable in a monorepo where `base` points at a subdirectory.
# Declaring it here is explicit and idempotent.
[[plugins]]
  package = "@netlify/plugin-nextjs"